# Baseline agent adapted from "Gemma 4 | Budget-Aware Coding Agent v2" (flexonafft), which credits
# matterhorn3838's "Gemma 4 SuperAgent" (https://www.kaggle.com/code/matterhorn3838/gemma-4-superagent),
# the official sample_submission prompt and community graph-tool investigations. Files are unchanged
# from that notebook; see docs/ATTRIBUTION.md. prompts/system.md is kept byte-identical for provenance.
name: swe_agent
model: gemma-4-e4b-it-qat-w4a16-ct
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
generate_content_config: !include configs/sampling.yaml
